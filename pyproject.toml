[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-infoflow"
version = "0.3.0"
description = "长在 Obsidian 里的个性化信息流：建画像、多源抓取、语义去重、3:7 排序、反馈进化。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
    "feedparser",
    "pyyaml",
    "python-dotenv",
    "trafilatura",
]

[project.optional-dependencies]
# 本地向量层（语义去重 +“更多类似”），首次使用会下载模型。
embed = ["fastembed"]
# 开发/测试。
dev = ["pytest", "ruff"]

[project.scripts]
infoflow = "infoflow.main:main"

[tool.setuptools]
packages = ["infoflow", "infoflow.webapp"]

[tool.setuptools.package-data]
# 运行期状态（data/）不随包分发——它是用户数据，已在 .gitignore 里。
infoflow = []
"infoflow.webapp" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 保守起步：语法/导入/未用变量等高信号规则，先不强推风格大改。
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # 行宽交给 line-length，叙述性中文注释不强切
